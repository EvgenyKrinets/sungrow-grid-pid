name: Build brand and release
# Generates HA 2026.3+ local branding and publishes semantic release.
# Release target: dynamic manifest.json version; v4.0.9 refreshed Night Tariff documentation and marketing images
# Night Tariff showcase generation and release trigger
# Publish version from manifest.json; never retag old releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/brand-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python source parses
        run: python -m compileall -q custom_components/sungrow_grid_pid
      - name: Test restart restoration and battery discharge safety
        run: python -m unittest discover -s tests -v
      - name: Test Start Time picker without re-rendering the card
        run: |
          node --check custom_components/sungrow_grid_pid/frontend/sungrow-grid-pid-card.js
          node tests/test_frontend_picker.cjs
      - name: Create local brand PNG files
        shell: python
        run: |
          import os, struct, zlib
          def png(path, size):
              w=h=size
              raw=bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      # cyan background, white lightning bolt
                      inside = (
                          (x > size*.47 and x < size*.60 and y > size*.14 and y < size*.49) or
                          (x > size*.36 and x < size*.53 and y > size*.42 and y < size*.57) or
                          (x > size*.40 and x < size*.50 and y > size*.52 and y < size*.86)
                      )
                      raw += bytes((255,255,255,255) if inside else (3,169,217,255))
              def chunk(t,d):
                  return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
              data=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",w,h,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(bytes(raw),9))+chunk(b"IEND",b"")
              open(path,"wb").write(data)
          d="custom_components/sungrow_grid_pid/brand"
          os.makedirs(d,exist_ok=True)
          png(d+"/icon.png",256)
          png(d+"/icon@2x.png",512)
          png(d+"/logo.png",256)
      - name: Generate refreshed Night Tariff product showcase
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/refresh_sem_showcase.py
          python - <<'PY'
          from PIL import Image
          p = "assets/sungrow-energy-manager-night-tariff.png"
          with Image.open(p) as im:
              im.verify()
          print("Showcase image PNG integrity OK")
          PY
      - name: Validate current product documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from PIL import Image
          import json
          root=Path(".")
          readme=(root/"README.md").read_text()
          required=[
            "assets/sungrow-energy-manager-night-tariff.png",
            "docs/how-it-works.svg", "docs/night-tariff.md",
            "docs/night-tariff.ru.md", "CHANGELOG.md"
          ]
          assert all((root/p).exists() for p in required)
          assert all(p in readme for p in required)
          for p in ("docs/how-it-works.svg", "icon.svg", "assets/sem-banner.svg"):
            ET.parse(root/p)
          with Image.open(root/"assets/sungrow-energy-manager-night-tariff.png") as im:
            im.verify()
          with Image.open(root/"docs/images/sungrow_grid_pid_energy_infographic.png") as im:
            im.verify()
          for p in ("strings.json", "translations/en.json", "translations/ru.json", "translations/he.json"):
            data=json.loads((root/"custom_components/sungrow_grid_pid"/p).read_text())
            assert "discount_scene_entity" in data["options"]["step"]["init"]["data"]
          assert "Night Tariff Mode" in readme
          assert "Grid Target" in readme
          assert "Morning Discharge" in readme
          print("Documentation links, translated entity selectors and images validated")
          PY
      - name: Commit brand files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/sungrow_grid_pid/brand assets/sungrow-energy-manager-night-tariff.png docs/images/sungrow_grid_pid_energy_infographic.png
          git diff --cached --quiet || git commit -m "Update SEM brand assets and Night Tariff product showcase"
          git push
      - name: Publish version from manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/sungrow_grid_pid/manifest.json"))["version"])')
          TAG="v${VERSION}"
          git fetch origin main --tags
          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git tag "${TAG}" origin/main
            git push origin "${TAG}"
          fi
          RELEASE_TITLE="Sungrow Energy Manager ${TAG}"
          RELEASE_NOTES="Sungrow Energy Manager ${TAG} stable release. Updated product README, full-resolution Night Tariff marketing infographic, 3-mode architecture diagram, English/Russian tariff setup guide and localized configuration text. No inverter-control algorithm changes. Full details: CHANGELOG.md."
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --title "${RELEASE_TITLE}" --notes "${RELEASE_NOTES}"
          else
            # Correct older release metadata without changing its tag or integration version.
            CURRENT_TITLE=$(gh release view "${TAG}" --json name -q .name)
            CURRENT_NOTES=$(gh release view "${TAG}" --json body -q .body)
            if [[ "${CURRENT_TITLE}" == *"(beta)"* ]] || [[ "${CURRENT_NOTES}" == "First SEM beta:"* ]]; then
              gh release edit "${TAG}" --title "${RELEASE_TITLE}" --notes "${RELEASE_NOTES}"
            fi
          fi
