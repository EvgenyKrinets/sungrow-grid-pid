<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0878d1"/><stop offset="1" stop-color="#31a9ef"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".18"/></filter></defs>
<rect width="1200" height="520" rx="34" fill="url(#bg)"/>
<text x="55" y="65" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="white">How Sungrow Grid PID works</text>
<text x="55" y="105" font-family="Arial,sans-serif" font-size="20" fill="#e9f7ff">The controller keeps grid export near your target by adjusting battery charging every second.</text>
<g font-family="Arial,sans-serif" text-anchor="middle" filter="url(#s)">
<rect x="55" y="175" width="220" height="155" rx="25" fill="white"/><text x="165" y="225" font-size="44">☀</text><text x="165" y="265" font-size="23" font-weight="700" fill="#14213d">SOLAR PV</text><text x="165" y="298" font-size="18" fill="#617087">Available solar power</text>
<rect x="365" y="175" width="220" height="155" rx="25" fill="white"/><text x="475" y="225" font-size="42">⚡</text><text x="475" y="265" font-size="23" font-weight="700" fill="#14213d">SUNGROW</text><text x="475" y="298" font-size="18" fill="#617087">Hybrid inverter</text>
<rect x="675" y="80" width="220" height="135" rx="25" fill="white"/><text x="785" y="125" font-size="38">⌂</text><text x="785" y="160" font-size="22" font-weight="700" fill="#14213d">HOME</text><text x="785" y="188" font-size="17" fill="#617087">House consumption</text>
<rect x="675" y="285" width="220" height="135" rx="25" fill="white"/><text x="785" y="330" font-size="38">▣</text><text x="785" y="365" font-size="22" font-weight="700" fill="#14213d">BATTERY</text><text x="785" y="393" font-size="17" fill="#159447">PID adjusts charging</text>
<rect x="975" y="175" width="170" height="155" rx="25" fill="white"/><text x="1060" y="225" font-size="40">⇥</text><text x="1060" y="265" font-size="22" font-weight="700" fill="#14213d">GRID</text><text x="1060" y="296" font-size="18" fill="#159447">Target export</text>
</g>
<g fill="none" stroke-linecap="round" stroke-width="12"><path d="M285 252H350" stroke="#ff9d00"/><path d="M595 225L660 175" stroke="#fff"/><path d="M595 285L660 335" stroke="#5bff93"/><path d="M905 252H960" stroke="#5bff93"/></g>
<g fill="#fff" font-family="Arial,sans-serif" font-size="18"><text x="55" y="475">1. Measure export</text><text x="310" y="475">2. Compare with target</text><text x="590" y="475">3. Adjust battery charge</text><text x="900" y="475">4. Repeat every second</text></g>
</svg>