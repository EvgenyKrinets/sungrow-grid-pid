<text x="72" y="676" font-size="25" font-weight="700" fill="#14334c">Priority and safety</text>
<text x="72" y="710" font-size="19" fill="#36536a">Forced Discharge  &gt;  Night Tariff scene selection  &gt;  default Self-Consumption scene.</text>
<text x="72" y="739" font-size="19" fill="#36536a">Scene commands are issued on mode transitions, not continuously every second.</text>
<text x="72" y="768" font-size="18" font-weight="700" fill="#bd6820">Verify that the chosen no-discharge scene really stops battery discharge on your inverter.</text>
<text x="48" y="848" font-size="17" fill="#698197">Configuration examples only. Actual inverter and BMS protections remain authoritative.</text>
